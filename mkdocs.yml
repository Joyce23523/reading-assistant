site_name: Joyce's Reading & Intelligence Archive
site_description: Personal knowledge archive for reading, intelligence reviews, and notes.
site_url: ""

theme:
  name: material
  palette:
    primary: indigo
    accent: deep purple
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Briefings:
      - Overview: briefings/index.md
      - Weekly Reviews: briefings/weekly.md
      - Monthly Reviews: briefings/monthly.md
      - Daily Briefings: briefings/daily.md
  - Health Science: health-science/index.md
  - Reading:
      - Overview: reading/index.md
      - Current Audiobooks: reading/current-audiobooks.md
      - Yesteryear: reading/yesteryear.md
      - The Correspondent: reading/the-correspondent.md
      - Audiobook Notes: reading/audiobook-notes.md
      - Vocabulary: reading/vocabulary.md
  - About: about.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
